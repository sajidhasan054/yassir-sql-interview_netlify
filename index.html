    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // SHA-256 Answer Hashing Helper
        async function hashOption(qId, optId) {
            if (!qId || !optId) return '';
            const secretSalt = window.YASSIR_CONFIG?.SECRET_KEY || 'yassir_eval_secret_2026';
            const msgUint8 = new TextEncoder().encode(`${qId}_${optId}_${secretSalt}`);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Helper to send real-time POST actions to Google Sheets API
        async function sendToGoogleSheets(action, data) {
            const sheetsUrl = window.YASSIR_CONFIG?.GOOGLE_SHEETS_URL;
            if (!sheetsUrl) return;
            try {
                await fetch(sheetsUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, data })
                });
            } catch (err) {
                console.warn("Google Sheets POST error:", err);
            }
        }

        const DEFAULT_QUESTIONS = [
            {
                id: 'q1',
                schemaId: 'hr_payroll',
                title: 'Employee & Department Inner Join',
                type: 'mcq',
                difficulty: 'Easy',
                question: 'How do you write a query to retrieve all columns from the employees and departments tables where the department_id matches?',
                options: [
                    { id: 'A', text: 'SELECT * FROM employees INNER JOIN departments ON employees.department_id = departments.department_id;' },
                    { id: 'B', text: 'SELECT * FROM employees JOIN departments WHERE employees.department_id = departments.department_id;' },
                    { id: 'C', text: 'SELECT * FROM employees LEFT JOIN departments ON employees.department_id = departments.department_id;' }
                ],

            },
            {
                id: 'q2',
                schemaId: 'hr_payroll',
                title: 'Filtering Aggregated Salaries',
                type: 'mcq',

                question: 'Which SQL query finds the average salary for each department, but only includes departments with an average salary greater than 50,000?',
                options: [
                    { id: 'A', text: 'SELECT department_id, AVG(salary) FROM employees WHERE AVG(salary) > 50000 GROUP BY department_id;' },
                    { id: 'B', text: 'SELECT department_id, AVG(salary) FROM employees GROUP BY department_id HAVING AVG(salary) > 50000;' },
                    { id: 'C', text: 'SELECT department_id, AVG(salary) FROM employees GROUP BY department_id WHERE AVG(salary) > 50000;' },
                    { id: 'D', text: 'SELECT department_id, AVG(salary) FROM employees HAVING AVG(salary) > 50000 GROUP BY department_id;' }
                ],

            },
            {
                id: 'q3',
                schemaId: 'hr_payroll',
                title: 'Subquery Comparison',
                type: 'mcq',
                difficulty: 'Medium',
                question: 'Which SQL query retrieves all employees whose salary is greater than the overall average salary?',
                options: [
                    { id: 'A', text: 'SELECT * FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);' },
                    { id: 'B', text: 'SELECT * FROM employees WHERE salary > AVG(salary);' },

                    { id: 'D', text: 'SELECT products.product_category_name, SUM(order_items.price) FROM orders INNER JOIN order_items ON orders.order_id = order_items.order_id INNER JOIN products ON order_items.product_id = products.product_id GROUP BY products.product_category_name;' }

                buggySql: `WITH RankedOrders AS (\n    SELECT u.user_id, o.order_id, o.order_value, o.order_status,\n    ROW_NUMBER() OVER (ORDER BY o.order_timestamp ASC) AS order_sequence\n    FROM users u JOIN orders o ON u.user_id = o.user_id\n    WHERE u.city = 'Algiers' \n)\nSELECT user_id, order_id, order_value FROM RankedOrders\nWHERE order_sequence = 2 AND order_status = 'completed';`

                    { id: 'A', text: 'SELECT user_id FROM orders WHERE order_status != "cancelled";' },
                    { id: 'B', text: 'SELECT DISTINCT user_id FROM orders WHERE user_id NOT IN (SELECT user_id FROM orders WHERE order_status = "cancelled");' },

                options: [

        const DEFAULT_EXAMS = [
            {
                id: 'exam-001',
                title: 'Yassir Product Data Analyst Technical Screen',
                passScore: 70,
                timeLimitMinutes: 20,
                questionIds: ['q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'],
                accessCode: 'YASSIR-2026',
                createdAt: '2026-01-01T00:00:00.000Z'
            },
            {
                id: 'exam-002',
                title: 'Data Engineering & Window Functions Screen',
                passScore: 80,
                timeLimitMinutes: 25,
                questionIds: ['q2', 'q3', 'q6', 'q7', 'q9', 'q10'],
                accessCode: 'DE-SQL-88',
                createdAt: '2026-01-01T00:00:00.000Z'
            }
        ];

        const DEFAULT_SUBMISSIONS = [];

        function App() {
            const [route, setRoute] = useState('candidate_entry');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Admin Credentials State
            const [adminAuth, setAdminAuth] = useState({ 
                id: window.YASSIR_CONFIG?.ADMIN_ID || 'admin', 
                password: '', 
                isAuthenticated: false, 
                error: '', 
                name: 'Interviewer Admin'
            });

            // Data State Management
            const [schemas] = useState(DEFAULT_SCHEMAS);
            const [questionBank, setQuestionBank] = useState(() => {
                const saved = localStorage.getItem('yassir_questions');
                return saved ? JSON.parse(saved) : DEFAULT_QUESTIONS;
            });
            const [exams, setExams] = useState(() => {
                const saved = localStorage.getItem('yassir_exams');
                return saved ? JSON.parse(saved) : DEFAULT_EXAMS;
            });
            const [submissions, setSubmissions] = useState(() => {
                const saved = localStorage.getItem('yassir_submissions');
                return saved ? JSON.parse(saved) : DEFAULT_SUBMISSIONS;
            });

            // Candidate Exam Flow State
            const [candidateInfo, setCandidateInfo] = useState({ name: '', email: '', examCode: 'YASSIR-2026' });
            const [activeExamId, setActiveExamId] = useState('exam-001');
            const [candidateSlide, setCandidateSlide] = useState(0);
            const [candidateAnswers, setCandidateAnswers] = useState({});
            const [candidateTextAnswers, setCandidateTextAnswers] = useState({});
            const [startTime, setStartTime] = useState(null);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [tabSwitchCount, setTabSwitchCount] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Modal & Form State
            const [selectedSubmission, setSelectedSubmission] = useState(null);
            const [isQuestionModalOpen, setIsQuestionModalOpen] = useState(false);
            const [editingQuestionId, setEditingQuestionId] = useState(null);
            const [questionForm, setQuestionForm] = useState({
                title: '', schemaId: 'olist', type: 'mcq', difficulty: 'Medium', question: '',
                options: [{ id: 'A', text: '' }, { id: 'B', text: '' }, { id: 'C', text: '' }, { id: 'D', text: '' }],
                correct: 'A', explanation: '', buggySql: ''
            });

            const [isExamModalOpen, setIsExamModalOpen] = useState(false);
            const [editingExamId, setEditingExamId] = useState(null);
            const [examForm, setExamForm] = useState({
                title: '', accessCode: '', passScore: 70, timeLimitMinutes: 20, questionIds: []
            });

            // Admin Results Filter State
            const [resultSearchTerm, setResultSearchTerm] = useState('');
            const [resultExamFilter, setResultExamFilter] = useState('ALL');
            const [resultStatusFilter, setResultStatusFilter] = useState('ALL');
            const [resultDateFilter, setResultDateFilter] = useState('');

            // Synchronize remote Google Sheets data
            const syncRemoteData = useCallback(async (showNotification = false) => {
                const sheetsUrl = window.YASSIR_CONFIG?.GOOGLE_SHEETS_URL;
                if (!sheetsUrl) return;
                
                setIsSyncing(true);
                try {
                    // Cache-busting URL with live timestamp parameter
                    const cacheBustingUrl = `${sheetsUrl}${sheetsUrl.includes('?') ? '&' : '?'}t=${Date.now()}`;
                    const res = await fetch(cacheBustingUrl);
                    if (res.ok) {
                        const remoteData = await res.json();
                        
                        // Merge Questions
                        if (remoteData.questions && Array.isArray(remoteData.questions)) {
                            const mergedMap = new Map();
                            DEFAULT_QUESTIONS.forEach(q => mergedMap.set(q.id, q));
                            remoteData.questions.forEach(q => { if (q && q.id) mergedMap.set(q.id, q); });
                            setQuestionBank(Array.from(mergedMap.values()));
                        }

                        // Merge Exams
                        if (remoteData.exams && Array.isArray(remoteData.exams)) {
                            const mergedMap = new Map();
                            DEFAULT_EXAMS.forEach(e => mergedMap.set(e.id, e));
                            remoteData.exams.forEach(e => { if (e && e.id) mergedMap.set(e.id, e); });
                            setExams(Array.from(mergedMap.values()));
                        }

                        // Merge Submissions
                        if (remoteData.submissions && Array.isArray(remoteData.submissions)) {
                            const mergedMap = new Map();
                            remoteData.submissions.forEach(s => { if (s && s.id) mergedMap.set(s.id, s); });
                            setSubmissions(Array.from(mergedMap.values()));
                        }

                        if (showNotification) {
                            showToast("Synced live data from Google Sheets!");
                        }
                    }
                } catch (err) {
                    console.warn("Google Sheets fetch error:", err);
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            // Smart Adaptive Polling Engine
            useEffect(() => {
                // Initial sync on mount
                syncRemoteData(false);

                // Polling interval function
                const pollInterval = setInterval(() => {
                    // 1. Skip polling if tab is hidden / minimized
                    if (document.hidden) return;

                    // 2. Skip polling if candidate is actively taking an exam to save bandwidth
                    if (route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= (activeQuestions?.length || 0)) {
                        return;
                    }

                    // Perform background sync
                    syncRemoteData(false);
                }, 20000); // 20-second efficient polling interval

                // Trigger immediate sync when returning to tab
                const handleTabFocus = () => {
                    if (!document.hidden) {
                        syncRemoteData(false);
                    }
                };
                document.addEventListener('visibilitychange', handleTabFocus);

                return () => {
                    clearInterval(pollInterval);
                    document.removeEventListener('visibilitychange', handleTabFocus);
                };
            }, [syncRemoteData, route, candidateSlide, activeQuestions?.length]);

            // LocalStorage Persistence
            useEffect(() => {
                localStorage.setItem('yassir_questions', JSON.stringify(questionBank));
            }, [questionBank]);

            useEffect(() => {
                localStorage.setItem('yassir_exams', JSON.stringify(exams));
            }, [exams]);

            useEffect(() => {
                localStorage.setItem('yassir_submissions', JSON.stringify(submissions));
            }, [submissions]);

            // Active Questions Memo
            const activeExam = useMemo(() => exams.find(e => e.id === activeExamId) || exams[0], [exams, activeExamId]);
            const activeQuestions = useMemo(() => {
                if (!activeExam || !activeExam.questionIds) return [];
                return activeExam.questionIds.map(qid => questionBank.find(q => q.id === qid)).filter(Boolean);
            }, [activeExam, questionBank]);

            // Timer & Anti-Cheat Listener
            useEffect(() => {
                let timer;
                if (startTime && route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= activeQuestions.length) {
                    timer = setInterval(() => {
                        setElapsedSeconds(Math.floor((Date.now() - startTime) / 1000));
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [startTime, route, candidateSlide, activeQuestions.length]);

            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= activeQuestions.length) {
                        setTabSwitchCount(prev => prev + 1);
                        showToast("Warning: Tab switch detected during assessment!", "error");
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [route, candidateSlide, activeQuestions.length]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                const validPass = window.YASSIR_CONFIG?.ADMIN_PASS || 'yassir2026!';
                if (adminAuth.id === 'admin' && adminAuth.password === validPass) {
                    setAdminAuth({ ...adminAuth, isAuthenticated: true, error: '' });
                    setRoute('page_results');
                    showToast("Admin authenticated successfully!");
                    syncRemoteData(false);
                } else {
                    setAdminAuth({ ...adminAuth, error: "Invalid Admin ID or Password." });
                }
            };

            const handleStartExam = (e) => {
                e.preventDefault();
                const matched = exams.find(ex => ex.accessCode.trim().toLowerCase() === candidateInfo.examCode.trim().toLowerCase());
                if (!matched) {
                    showToast("Invalid Exam Access Code. Check code with interviewer.", "error");
                    return;
                }
                setActiveExamId(matched.id);
                setStartTime(Date.now());
                setElapsedSeconds(0);
                setTabSwitchCount(0);
                setCandidateSlide(1);
                setRoute('candidate_exam');
            };

            const handleSubmitExam = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                try {
                    let score = 0;
                    let mcqTotal = 0;

                    for (const q of (activeQuestions || [])) {
                        if (q.type === 'mcq') {
                            mcqTotal += 1;
                            const chosenOpt = candidateAnswers[q.id];
                            if (chosenOpt) {
                                if (q.correct && chosenOpt === q.correct) {
                                    score += 1;
                                } else {
                                    const expectedHash = q.correctHash || (q.correct ? await hashOption(q.id, q.correct) : null);
                                    const chosenHash = await hashOption(q.id, chosenOpt);
                                    if (expectedHash && chosenHash === expectedHash) {
                                        score += 1;
                                    }
                                }
                            }
                        }
                    }

                    const now = new Date();
                    const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${now.toLocaleTimeString()}`;

                    const submissionData = {
                        id: `sub-${Date.now()}`,
                        candidateName: candidateInfo.name,
                        candidateEmail: candidateInfo.email,
                        examId: activeExamId,
                        examTitle: activeExam?.title || 'Technical Screen',
                        examCode: activeExam?.accessCode || candidateInfo.examCode,
                        mcqAnswers: candidateAnswers,
                        textAnswers: candidateTextAnswers,
                        mcqScore: score,
                        mcqTotal: mcqTotal,
                        percentage: mcqTotal > 0 ? Math.round((score / mcqTotal) * 100) : 0,
                        timeTakenSeconds: elapsedSeconds,
                        tabSwitches: tabSwitchCount,
                        submittedAt: formattedDate
                    };

                    // Real-time Save to Google Sheets
                    await sendToGoogleSheets("add_submission", submissionData);

                    // Native Netlify Form POST Request
                    if (window.YASSIR_CONFIG?.ENABLE_NETLIFY_FORMS !== false) {
                        try {
                            const formData = new URLSearchParams();
                            formData.append("form-name", "candidate-submissions");
                            formData.append("candidateName", submissionData.candidateName);
                            formData.append("candidateEmail", submissionData.candidateEmail);
                            formData.append("examTitle", submissionData.examTitle);
                            formData.append("examCode", submissionData.examCode);
                            formData.append("mcqScore", `${submissionData.mcqScore} / ${submissionData.mcqTotal}`);
                            formData.append("percentage", `${submissionData.percentage}%`);
                            formData.append("timeTakenSeconds", submissionData.timeTakenSeconds);
                            formData.append("tabSwitches", submissionData.tabSwitches);
                            formData.append("submittedAt", submissionData.submittedAt);
                            formData.append("textAnswers", JSON.stringify(submissionData.textAnswers));

                            await fetch("/", {
                                method: "POST",
                                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                                body: formData.toString()
                            });
                        } catch (err) {
                            console.warn("Netlify form post error:", err);
                        }
                    }

                    setSubmissions(prev => [submissionData, ...prev]);
                    setCandidateSlide((activeQuestions?.length || 0) + 1);
                    showToast("Assessment submitted & synced to Google Sheets!");
                    
                    setTimeout(() => syncRemoteData(false), 1200);
                } catch (err) {
                    console.error("Submission error:", err);
                    showToast("Failed to submit exam. Please try again.", "error");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleOpenQuestionModal = (question = null) => {
                if (question) {
                    setEditingQuestionId(question.id);
                    setQuestionForm({ ...question });
                } else {
                    setEditingQuestionId(null);
                    setQuestionForm({
                        title: '',
                        schemaId: Object.keys(schemas)[0] || 'olist',
                        type: 'mcq',
                        difficulty: 'Medium',
                        question: '',
                        options: [
                            { id: 'A', text: '' },
                            { id: 'B', text: '' },
                            { id: 'C', text: '' },
                            { id: 'D', text: '' }
                        ],
                        correct: 'A',
                        explanation: '',
                        buggySql: ''
                    });
                }
                setIsQuestionModalOpen(true);
            };

            const handleSaveQuestion = async (e) => {
                e.preventDefault();
                const qId = editingQuestionId || `q-${Date.now()}`;
                const hashedValue = await hashOption(qId, questionForm.correct);

                const qToSave = {
                    ...questionForm,
                    id: qId,
                    correctHash: hashedValue
                };

                const actionType = editingQuestionId ? "update_question" : "add_question";
                await sendToGoogleSheets(actionType, qToSave);

                if (editingQuestionId) {
                    setQuestionBank(prev => prev.map(q => q.id === editingQuestionId ? qToSave : q));
                    showToast("Question updated!");
                } else {
                    setQuestionBank(prev => [qToSave, ...prev]);
                    showToast("New question added!");
                }

                setIsQuestionModalOpen(false);
                setTimeout(() => syncRemoteData(false), 1200);
            };

            const handleDeleteQuestion = async (id) => {
                setConfirmModal({
                    title: "Delete Question",
                    message: "Are you sure you want to remove this question from the bank?",
                    onConfirm: async () => {
                        await sendToGoogleSheets("delete_question", { id });
                        setQuestionBank(prev => prev.filter(q => q.id !== id));
                        showToast("Question deleted from Google Sheets.");
                        setConfirmModal(null);
                        setTimeout(() => syncRemoteData(false), 1200);
                    }
                });
            };

            const handleOpenExamModal = (exam = null) => {
                if (exam) {
                    setEditingExamId(exam.id);
                    setExamForm({
                        title: exam.title,
                        accessCode: exam.accessCode,
                        passScore: exam.passScore || 70,
                        timeLimitMinutes: exam.timeLimitMinutes || 20,
                        questionIds: [...exam.questionIds]
                    });
                } else {
                    setEditingExamId(null);
                    setExamForm({
                        title: '',
                        accessCode: `YASSIR-${Math.floor(1000 + Math.random() * 9000)}`,
                        passScore: 70,
                        timeLimitMinutes: 20,
                        questionIds: questionBank.slice(0, 5).map(q => q.id)
                    });
                }
                setIsExamModalOpen(true);
            };

            const handleSaveExam = async (e) => {
                e.preventDefault();
                if (examForm.questionIds.length === 0) {
                    showToast("Select at least 1 question for the exam template.", "error");
                    return;
                }

                let exToSave;
                if (editingExamId) {
                    exToSave = { ...examForm, id: editingExamId, createdAt: new Date().toISOString() };
                    setExams(prev => prev.map(ex => ex.id === editingExamId ? exToSave : ex));
                    showToast("Exam template updated!");
                } else {
                    exToSave = {
                        ...examForm,
                        id: `exam-${Date.now()}`,
                        createdAt: new Date().toISOString()
                    };
                    setExams(prev => [exToSave, ...prev]);
                    showToast("New exam paper created!");
                }

                const actionType = editingExamId ? "update_exam" : "add_exam";
                await sendToGoogleSheets(actionType, exToSave);
                setIsExamModalOpen(false);
                setTimeout(() => syncRemoteData(false), 1200);
            };

            const handleDeleteExam = async (id) => {
                setConfirmModal({
                    title: "Delete Exam Template",
                    message: "Are you sure you want to delete this exam paper?",
                    onConfirm: async () => {
                        await sendToGoogleSheets("delete_exam", { id });
                        setExams(prev => prev.filter(ex => ex.id !== id));
                        showToast("Exam paper deleted from Google Sheets.");
                        setConfirmModal(null);
                        setTimeout(() => syncRemoteData(false), 1200);
                    }
                });
            };

            const exportJSONFile = (data, filename) => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`Downloaded ${filename}`);
            };

            const exportResultsCSV = () => {
                let csv = "Candidate Name,Candidate Email,Exam Title,Exam Code,MCQ Score,MCQ Total,Percentage,Time Spent (s),Tab Switches,Submitted At\n";
                submissions.forEach(s => {
                    csv += `"${s.candidateName}","${s.candidateEmail}","${s.examTitle}","${s.examCode}",${s.mcqScore},${s.mcqTotal},${s.percentage}%,${s.timeTakenSeconds},${s.tabSwitches},"${s.submittedAt}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `candidate_results_${Date.now()}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportSubmissions = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        const items = Array.isArray(parsed) ? parsed : [parsed];
                        setSubmissions(prev => {
                            const merged = [...items];
                            prev.forEach(p => {
                                if (!merged.find(m => m.id === p.id)) merged.push(p);
                            });
                            return merged;
                        });
                        showToast(`Imported ${items.length} submission records!`);
                    } catch (err) {
                        showToast("Invalid JSON file.", "error");
                    }
                };
                reader.readAsText(file);
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // Filtered Submissions Computation
            const filteredSubmissions = useMemo(() => {
                return submissions.filter(sub => {
                    const matchesSearch = !resultSearchTerm || 
                        sub.candidateName.toLowerCase().includes(resultSearchTerm.toLowerCase()) ||
                        sub.candidateEmail.toLowerCase().includes(resultSearchTerm.toLowerCase());
                    const matchesExam = resultExamFilter === 'ALL' || sub.examId === resultExamFilter;
                    
                    const matchedExam = exams.find(e => e.id === sub.examId);
                    const passThreshold = matchedExam ? (matchedExam.passScore || 70) : 70;
                    const isPassed = sub.percentage >= passThreshold;

                    const matchesStatus = resultStatusFilter === 'ALL' || 
                        (resultStatusFilter === 'PASS' && isPassed) ||
                        (resultStatusFilter === 'FAIL' && !isPassed);

                    const matchesDate = !resultDateFilter || sub.submittedAt.startsWith(resultDateFilter);

                    return matchesSearch && matchesExam && matchesStatus && matchesDate;
                });
            }, [submissions, resultSearchTerm, resultExamFilter, resultStatusFilter, resultDateFilter, exams]);

            const totalQs = activeQuestions?.length || 0;

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between overflow-x-hidden">
                    
                    {/* TOAST NOTIFICATION BANNER */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-2xl font-semibold text-xs flex items-center space-x-2 border transition-all ${
                            toast.type === 'error' ? 'bg-red-950 border-red-800 text-red-200' : 'bg-emerald-950 border-emerald-800 text-emerald-200'
                        }`}>
                            <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation text-red-400' : 'fa-circle-check text-emerald-400'}`}></i>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    {/* CONFIRMATION MODAL */}
                    {confirmModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-6">

                                </div>
                            </div>
                        </div>

                            <div className="bg-sky-500 text-slate-950 font-black tracking-widest text-lg px-2.5 py-0.5 rounded shadow-lg shadow-sky-500/20">
                                YASSIR
                            </div>
                            <div className="flex flex-col">
                                <span className="text-white text-sm font-bold">Data Analytics Technical Assessment</span>
                                <div className="flex items-center space-x-2">
                                    <span className="text-[10px] text-slate-400 font-mono">
                                        Google Sheets Live Database Engine
                                    </span>
                                    <button 
                                        onClick={() => syncRemoteData(true)} 
                                        disabled={isSyncing} 
                                        className="text-[10px] bg-slate-800 hover:bg-slate-700 text-sky-400 px-2 py-0.5 rounded border border-slate-700 flex items-center space-x-1"
                                    >
                                        <i className={`fa-solid fa-rotate ${isSyncing ? 'animate-spin' : ''}`}></i>
                                        <span>{isSyncing ? 'Syncing...' : 'Sync Now'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= totalQs && (
                            <div className="flex items-center space-x-3">
                                {tabSwitchCount > 0 && (
                                    <div className="flex items-center space-x-1.5 bg-red-950/80 px-3 py-1.5 rounded-full border border-red-800 text-red-400 font-mono text-xs font-semibold animate-pulse">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>Tab Switches: {tabSwitchCount}</span>
                                    </div>
                                )}
                                <div className="flex items-center space-x-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700 text-sky-400 font-mono text-xs font-semibold">
                                    <i className="fa-regular fa-clock text-sky-400"></i>
                                    <span>{formatTime(elapsedSeconds)} / {activeExam?.timeLimitMinutes || 20}:00</span>
                                </div>
                            </div>
                        )}

                        {adminAuth.isAuthenticated ? (
                            <div className="flex items-center space-x-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                                <button onClick={() => setRoute('candidate_entry')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route.startsWith('candidate') ? 'bg-sky-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Candidate View</button>
                                <button onClick={() => setRoute('page_questions')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_questions' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Questions ({questionBank.length})</button>
                                <button onClick={() => setRoute('page_exams')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_exams' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Exams ({exams.length})</button>
                                <button onClick={() => setRoute('page_results')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_results' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Results ({submissions.length})</button>
                                <button onClick={() => { setAdminAuth(prev => ({ ...prev, isAuthenticated: false })); setRoute('candidate_entry'); }} className="px-2.5 py-1.5 bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-300 rounded-lg font-bold text-xs">Log Out</button>
                            </div>
                        ) : (
                            <div className="flex items-center space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                                <button onClick={() => setRoute('candidate_entry')} className={`px-3 py-1.5 rounded-lg font-bold ${route.startsWith('candidate') ? 'bg-sky-500 text-slate-950' : 'text-slate-400'}`}>Candidate View</button>
                                <button onClick={() => setRoute('admin_login')} className={`px-3 py-1.5 rounded-lg font-bold ${route === 'admin_login' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}><i className="fa-solid fa-lock text-amber-400 mr-1"></i>Admin Portal</button>
                            </div>
                        )}
                    </header>

                    {/* MAIN VIEW SYSTEM */}
                    <main className="flex-1 p-6 flex items-center justify-center relative">

                        {/* VIEW 1: CANDIDATE ENTRY FORM */}
                        {route === 'candidate_entry' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
                                <div className="space-y-1">
                                    <div className="text-sky-400 text-xs font-mono font-bold flex items-center space-x-1.5">
                                        <i className="fa-solid fa-shield-halved"></i>
                                        <span>CANDIDATE EXAM PORTAL</span>
                                    </div>
                                    <h1 className="text-2xl font-bold text-white">Start Candidate Session</h1>

                                </div>

                                <form onSubmit={handleStartExam} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block text-slate-300 font-semibold mb-1">Full Name</label>
                                        <input type="text" required value={candidateInfo.name} onChange={e => setCandidateInfo({ ...candidateInfo, name: e.target.value })} placeholder="e.g. Sarah Mansouri" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 font-semibold mb-1">Email Address</label>
                                        <input type="email" required value={candidateInfo.email} onChange={e => setCandidateInfo({ ...candidateInfo, email: e.target.value })} placeholder="sarah@example.com" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 font-semibold mb-1">Exam Access Code</label>
                                        <input type="text" required value={candidateInfo.examCode} onChange={e => setCandidateInfo({ ...candidateInfo, examCode: e.target.value })} placeholder="e.g. YASSIR-2026" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sky-400 font-mono font-bold uppercase focus:outline-none focus:border-sky-500" />

                                    <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition-all flex items-center justify-center space-x-2 shadow-lg shadow-sky-500/20">
                                        <span>Launch Assessment</span>
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </form>
                            </div>

                        {/* VIEW 2: CANDIDATE ACTIVE EXAM */}

                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col justify-between min-h-[500px]">
                                        {(() => {
                                            const currentQ = activeQuestions[candidateSlide - 1];
                                            if (!currentQ) return null;
                                            const schema = schemas[currentQ.schemaId] || Object.values(schemas)[0] || { name: 'Standard Schema', tables: [] };
                                            const selectedOption = candidateAnswers[currentQ.id];
                                            const textAns = candidateTextAnswers[currentQ.id] || { flawsText: '', sqlText: '' };

                                            return (
                                                <div className="grid grid-cols-12 gap-6 flex-1">
                                                    {/* LEFT PANEL */}
                                                    <div className="col-span-5 border-r border-slate-800 pr-5 flex flex-col justify-between space-y-4">
                                                        <div className="space-y-3">
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-mono font-bold text-sky-400 bg-sky-950 border border-sky-800 px-3 py-0.5 rounded-full">
                                                                    Question {candidateSlide} / {totalQs}
                                                                </span>
                                                                <span className={`text-[10px] px-2 py-0.5 rounded font-mono font-semibold ${
                                                                    currentQ.difficulty === 'Easy' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                                                    currentQ.difficulty === 'Medium' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                                                    'bg-red-950 text-red-400 border border-red-800'
                                                                }`}>
                                                                    {currentQ.difficulty}
                                                                </span>
                                                            </div>
                                                            <h2 className="text-base font-bold text-slate-100 leading-snug">{currentQ.question}</h2>
                                                        </div>

                                                        {/* SCHEMA DRAWER */}
                                                        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 overflow-y-auto max-h-56 text-xs font-mono">
                                                            <span className="text-amber-400 font-bold block border-b border-slate-800 pb-1 flex items-center gap-1.5">
                                                                <i className="fa-solid fa-database"></i>
                                                                <span>Schema: {schema.name}</span>
                                                            </span>
                                                            {schema.tables?.map((t, idx) => (
                                                                <div key={idx} className="space-y-0.5">
                                                                    <span className="text-sky-400 font-bold block text-[11px]">// {t.name}</span>
                                                                    <div className="pl-2 text-slate-300 text-[10px]">{t.cols.join(' • ')}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    {/* RIGHT PANEL */}
                                                    <div className="col-span-7 flex flex-col justify-between pl-1">
                                                        {currentQ.type === 'mcq' && currentQ.options && (
                                                            <div className="space-y-3 my-auto">
                                                                {currentQ.options.map((opt) => {
                                                                    const isSelected = selectedOption === opt.id;
                                                                    return (
                                                                        <div key={opt.id} onClick={() => setCandidateAnswers(prev => ({ ...prev, [currentQ.id]: opt.id }))} className={`p-3.5 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-sky-500/10 border-sky-500 text-sky-200 ring-1 ring-sky-500' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                                                            <span className="text-xs font-mono pr-2">{opt.text}</span>
                                                                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center text-xs font-bold ${isSelected ? 'border-sky-400 bg-sky-500 text-slate-950' : 'border-slate-700 text-slate-500'}`}>{opt.id}</div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}

                                                        {currentQ.type === 'scenario' && (
                                                            <div className="space-y-3 my-auto text-xs">
                                                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-[11px] text-sky-300 max-h-36 overflow-y-auto">
                                                                    <pre>{currentQ.buggySql}</pre>
                                                                </div>
                                                                <div>
                                                                    <label className="block text-[11px] font-semibold text-slate-300 mb-1">1. Logical Bugs Analysis:</label>
                                                                    <textarea rows={2} value={textAns.flawsText} onChange={e => setCandidateTextAnswers(prev => ({ ...prev, [currentQ.id]: { ...prev[currentQ.id], flawsText: e.target.value } }))} placeholder="Explain flaws..." className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-[11px] font-semibold text-slate-300 mb-1">2. Refactored SQL Query:</label>
                                                                    <textarea rows={3} value={textAns.sqlText} onChange={e => setCandidateTextAnswers(prev => ({ ...prev, [currentQ.id]: { ...prev[currentQ.id], sqlText: e.target.value } }))} placeholder="WITH RankedOrders AS ( ... )" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 font-mono text-sky-300 focus:outline-none focus:border-sky-500" />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                {candidateSlide > totalQs && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center max-w-lg mx-auto shadow-2xl space-y-4">
                                        <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                                            <i className="fa-solid fa-circle-check"></i>
                                        </div>
                                        <h2 className="text-2xl font-bold text-white">Assessment Complete!</h2>
                                        <p className="text-slate-400 text-xs leading-relaxed">
                                            Thank you, <span className="text-sky-400 font-bold">{candidateInfo.name}</span>. Your responses have been submitted to the recruitment team. You may now close this window.
                                        </p>
                                    </div>
                                )}

                                {candidateSlide >= 1 && candidateSlide <= totalQs && (
                                    <div className="flex justify-between items-center bg-slate-900/90 border border-slate-800 p-3 rounded-xl">
                                        <button onClick={() => setCandidateSlide(prev => Math.max(1, prev - 1))} disabled={candidateSlide === 1 || isSubmitting} className="px-4 py-2 bg-slate-800 disabled:opacity-30 text-xs font-bold rounded-lg text-slate-300">Previous</button>

                                        </div>

                                    </form>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* FOOTER */}
                    <footer className="h-10 border-t border-slate-900 bg-slate-950 px-6 flex items-center justify-between text-[11px] text-slate-500">
                        <div>Yassir Data Analytics Engineering Assessment Platform</div>
                        <div className="font-mono">Active Questions: <strong className="text-amber-400">{questionBank.length}</strong></div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
